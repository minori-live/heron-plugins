[workspace]
members = [
  "crates/iced-ui",
  "crates/plugin-dsp",
  "crates/revox-dsp",
  "plugins/heron-plugin-ui",
  "plugins/heron-gain",
  "plugins/heron-eq",
  "plugins/heron-revox",
  "plugins/heron-sine",
  "plugins/heron-metronome"
]
resolver = "3"

[workspace.metadata.cargo-shear]
# The format dependencies are used by the expansion of truce::plugin!.
ignored = ["truce-vst3", "truce-au", "truce-aax"]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/minori-live/heron-plugins"

[workspace.dependencies]
fearless_simd = { version = "1.1.0", features = ["force_support_fallback"] }
fearless_simd_macros = "0.1.0"
criterion = { version = "0.8.2", features = ["html_reports", "csv_output"] }
rustfft = "6.4.1"
ort = { version = "=2.0.0-rc.14", default-features = false, features = [
  "std",
  "download-binaries",
  "tls-native",
  "copy-dylibs",
  "api-31"
] }
hound = "3.5.1"
thiserror = "2.0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
iced_core = "0.14.0"
iced_widget = "0.14.2"
truce = { version = "=6.3.0", default-features = false }
truce-iced = "=6.3.0"
truce-test = "=6.3.0"
truce-vst3 = "=6.3.0"
truce-au = "=6.3.0"
truce-aax = "=6.3.0"
heron-iced-ui = { path = "crates/iced-ui" }
heron-plugin-ui = { path = "plugins/heron-plugin-ui" }
heron-plugin-dsp = { path = "crates/plugin-dsp" }
heron-revox-dsp = { path = "crates/revox-dsp" }
crossbeam-queue = "0.3.14"

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
# Keep compiler debug information available for local debugging.
debug = 2

[patch.crates-io]
baseview-truce = { path = "third_party/baseview-truce" }
truce-gui = { path = "third_party/truce-gui" }
truce-iced = { path = "third_party/truce-iced" }
