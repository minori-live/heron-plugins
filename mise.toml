min_version = "2026.10.0"

[tools]
node = "26"
pnpm = "12.10.0"
rust = { channel = "stable", version = "latest", components = "rustfmt,clippy,llvm-tools" }
cmake = "4.3"
"cargo:cargo-truce" = "6.3"
"cargo:cargo-llvm-cov" = "0.8"
"cargo:cargo-shear" = "1.13"
apm = "0.33.0"

[settings]
lockfile = true

[tasks.install]
run = "pnpm install --frozen-lockfile --prefer-offline"

[tasks.check]
depends = ["install"]
run = [
  "node scripts/version.ts check",
  "pnpm format:check",
  "pnpm lint",
  "pnpm check",
  "cargo fmt --all -- --check",
  "cargo shear",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "cargo test --locked -p heron-gain --features rt-paranoid",
  "cargo test --locked -p heron-eq --features rt-paranoid",
  "cargo test --locked -p heron-sine --features rt-paranoid",
  "cargo test --locked -p heron-metronome --features rt-paranoid",
  "cargo test --locked -p heron-revox --features rt-paranoid",
  "cargo test --locked -p heron-repitch --features rt-paranoid"
]

[tasks."check-fast"]
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked"
]

[tasks.build]
depends = ["install"]
run = "node scripts/build.ts"

[tasks."sdk:vst3"]
run = "node scripts/fetch-vst3-sdk.ts"

[tasks.format]
depends = ["install"]
run = ["pnpm format", "cargo fmt --all"]

[tasks."format-check"]
depends = ["install"]
run = ["pnpm format:check", "cargo fmt --all -- --check"]

[tasks.lint]
depends = ["install"]
run = ["pnpm lint", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks."ci:coverage"]
depends = ["install"]
run = "node scripts/coverage.ts"

[tasks."ci:report:sccache"]
run = "node scripts/ci-sccache-report.ts"
