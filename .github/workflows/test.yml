name: Test
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  MACOSX_DEPLOYMENT_TARGET: "14.2"
jobs:
  revox-models:
    uses: ./.github/workflows/revox-models.yml
    with:
      artifact_name: revox-test-models
  checks:
    needs: revox-models
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, flag: rust-linux }
          - { name: Windows x64, os: windows-latest, flag: rust-windows }
          - { name: macOS, os: macos-latest, flag: rust-macos }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache-rust-build: "true"
      - name: Check source
        if: runner.os == 'Linux'
        run: |
          node scripts/version.ts check
          pnpm format:check
          pnpm lint
          pnpm exec tsc6 --noEmit
          cargo fmt --all -- --check
          cargo shear
      - name: Test release tooling
        run: node --test scripts/*.test.ts
      - name: Restore build-verified inference models
        uses: actions/download-artifact@v8
        with:
          name: revox-test-models
          path: target/revox
      - name: Prepare pinned Python for Windows ONNX Runtime source build
        if: runner.os == 'Windows'
        run: |
          mise install uv@0.11.1
          mise exec uv@0.11.1 -- uv venv --python 3.12.13 target/revox/runtime-venv
          cygpath -w "$PWD/target/revox/runtime-venv/Scripts" >> "$GITHUB_PATH"
      - name: Prepare pinned CPU runtime for test executables
        run: node scripts/revox-runtime.ts
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust with coverage
        run: node scripts/coverage.ts
      - name: Check real-time allocations
        run: |
          cargo test --locked -p heron-gain --features rt-paranoid
          cargo test --locked -p heron-eq --features rt-paranoid
          cargo test --locked -p heron-sine --features rt-paranoid
          cargo test --locked -p heron-metronome --features rt-paranoid
          cargo test --locked -p heron-revox --features rt-paranoid
          cargo test --locked -p heron-repitch --features rt-paranoid
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust/lcov.info
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}
          fail_ci_if_error: true
          disable_search: true
      - name: Report compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache
  codecov-finalize:
    name: Finalize Codecov coverage
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true
