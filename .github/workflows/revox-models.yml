name: Prepare Revox models
on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare pinned Revox models
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.6
          install_args: node
      - name: Export FCPE and acquire Revox once for all native checks
        run: |
          mise install uv@0.11.1
          mise exec uv@0.11.1 -- uv venv --python 3.12.13 target/revox/venv
          mise exec uv@0.11.1 -- uv pip install --python target/revox/venv/bin/python --require-hashes -r scripts/revox/requirements.lock
          target/revox/venv/bin/python scripts/revox/export_fcpe.py
          node scripts/fetch-revox-model.ts
          target/revox/venv/bin/python scripts/revox/prepare_vocoder.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            target/revox/fcpe.onnx
            target/revox/fcpe-export.json
            target/revox/fcpe-plugin.onnx
            target/revox/fcpe-plugin-export.json
            target/revox/fcpe-upstream/LICENSE
            target/revox/models/
          if-no-files-found: error
          retention-days: 1
