name: Build
on:
  workflow_dispatch:
    inputs:
      validate_apple_credentials:
        description: Validate configured Apple credentials without building or publishing artifacts.
        type: boolean
        default: false
      full_release_profile:
        description: Keep thin-LTO release settings for a packaging smoke build.
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      full_release_profile:
        type: boolean
        default: false
    secrets:
      MAC_CSC_LINK: { required: false }
      MAC_CSC_KEY_PASSWORD: { required: false }
      APPLE_API_KEY_P8: { required: false }
      APPLE_API_KEY_ID: { required: false }
      APPLE_API_ISSUER: { required: false }
      AAX_SDK_URL: { required: false }
      AAX_SDK_TOKEN: { required: false }
      PACE_ACCOUNT: { required: false }
      PACE_SIGN_ID_MACOS: { required: false }
      PACE_SIGN_ID_WINDOWS: { required: false }
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
jobs:
  apple-credentials:
    name: Validate Apple release credentials
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_apple_credentials }}
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.6
          install_args: node
      - name: Validate signing identity and notarization authentication
        id: apple
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/apple-credentials.ts
      - name: Remove imported Apple credentials
        if: ${{ always() && (steps.apple.outcome == 'success' || steps.apple.outcome == 'failure') }}
        run: node scripts/apple-credentials.ts clean
  configuration:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.validate_apple_credentials) }}
    runs-on: ubuntu-24.04
    outputs:
      aax: ${{ steps.config.outputs.aax }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: config
        run: echo "aax=$(jq -r '.aax.enabled' release-config.json)" >> "$GITHUB_OUTPUT"
  revox-models:
    needs: configuration
    uses: ./.github/workflows/revox-models.yml
    with:
      artifact_name: revox-build-models
  package:
    needs: [configuration, revox-models]
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest }
          - { platform: linux-x64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: macos-universal, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.event_name != 'pull_request' && github.token || '' }}
      - name: Fetch pinned VST3 SDK for bundle probes
        run: mise run sdk:vst3
      - name: Restore build-verified inference models
        uses: actions/download-artifact@v8
        with:
          name: revox-build-models
          path: target/revox
      - name: Use a faster smoke-build profile
        if: ${{ !inputs.full_release_profile && !inputs.release }}
        run: |
          echo 'CARGO_PROFILE_RELEASE_LTO=off' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16' >> "$GITHUB_ENV"
      - name: Ensure Rosetta for Intel AU validation
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Prepare pinned Python for ONNX Runtime source builds
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: |
          mise install uv@0.11.1
          mise exec uv@0.11.1 -- uv venv --clear --python 3.12.13 target/revox/runtime-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cygpath -w "$PWD/target/revox/runtime-venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/target/revox/runtime-venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Import release signing credentials
        id: apple
        if: ${{ inputs.release && runner.os == 'macOS' }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/apple-credentials.ts
      - name: Package and verify runtime bundles
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/build.ts --no-aax ${{ inputs.release && '--release' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            target/release-assets/*.zip
            target/release-assets/*.dmg
            !target/release-assets/*-symbols.zip
          if-no-files-found: error
          retention-days: 90
      - name: Remove imported Apple credentials
        if: ${{ always() && inputs.release && runner.os == 'macOS' && steps.apple.outcome != 'skipped' }}
        run: node scripts/apple-credentials.ts clean
      - name: Report compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache
  aax:
    name: AAX release (${{ matrix.platform }})
    needs: configuration
    # Off initially. Licensed tools and secrets are never exposed to a public PR.
    if: ${{ inputs.release && needs.configuration.outputs.aax == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            runner: [self-hosted, heron-plugins-macos-aax]
          - platform: windows-x64
            runner: [self-hosted, heron-plugins-windows-aax]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ github.token }}
      - name: Import Apple signing credentials
        id: apple
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/apple-credentials.ts
      - name: Build and validate licensed AAX bundles with PACE signing
        env:
          AAX_SDK_URL: ${{ secrets.AAX_SDK_URL }}
          AAX_SDK_TOKEN: ${{ secrets.AAX_SDK_TOKEN }}
          AAX_SDK_LICENSE_ACCEPTED: ${{ vars.AAX_SDK_LICENSE_ACCEPTED }}
          AAX_VALIDATOR: ${{ matrix.platform == 'macos-universal' && vars.AAX_VALIDATOR_MACOS || vars.AAX_VALIDATOR_WINDOWS }}
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_SIGN_ID: ${{ matrix.platform == 'macos-universal' && secrets.PACE_SIGN_ID_MACOS || secrets.PACE_SIGN_ID_WINDOWS }}
          PACE_SIGNING_SERVICE_READY: ${{ vars.PACE_SIGNING_SERVICE_READY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/build.ts --release --only-aax
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}-aax
          path: |
            target/release-assets/*-aax.zip
            !target/release-assets/*-symbols.zip
          if-no-files-found: error
          retention-days: 90
      - name: Remove imported Apple credentials
        if: ${{ always() && runner.os == 'macOS' && steps.apple.outcome != 'skipped' }}
        run: node scripts/apple-credentials.ts clean
      - name: Report compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache
