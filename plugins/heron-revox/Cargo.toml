[package]
name = "heron-revox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["vst3"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
aax = ["dep:truce-aax"]
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce.workspace = true
truce-iced.workspace = true
truce-vst3 = { workspace = true, optional = true }
truce-au = { workspace = true, optional = true }
truce-aax = { workspace = true, optional = true }
heron-plugin-ui.workspace = true
heron-revox-dsp.workspace = true
crossbeam-queue.workspace = true
fearless_simd.workspace = true
fearless_simd_macros.workspace = true

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
truce-test.workspace = true
criterion.workspace = true

[[bench]]
name = "resampling"
harness = false

[lints]
workspace = true
