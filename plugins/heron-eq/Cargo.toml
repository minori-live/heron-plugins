[package]
name = "heron-eq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-shear]
# This capture harness is run only in the archived original Heron workspace.
ignored-paths = ["tests/fixtures/generate_legacy.rs"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["vst3"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
aax = ["dep:truce-aax"]
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce.workspace = true
truce-iced.workspace = true
truce-vst3 = { workspace = true, optional = true }
truce-au = { workspace = true, optional = true }
truce-aax = { workspace = true, optional = true }
heron-plugin-ui.workspace = true
heron-plugin-dsp.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
arboard.workspace = true

[dev-dependencies]
truce-test.workspace = true
iced_runtime = "0.14.0"

[target.'cfg(any(windows, target_os = "macos"))'.dev-dependencies]
baseview = { package = "baseview-truce", version = "=0.1.1-truce.13" }
raw-window-handle-05 = { package = "raw-window-handle", version = "=0.5.2" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSEvent",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core"
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSDate",
  "NSRunLoop"
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "CALayer",
  "CAMetalLayer"
] }

[[test]]
name = "native_scale"
harness = false

[lints]
workspace = true
